main: net.tfminecraft.vfbuilders.VFBuilders
api-version: '1.21.10'
name: VFBuilders
version: ${project.version}
author: Drefvelin
folia-supported: true

depend: [TLibs, VehicleFramework]

commands:
  vfbuilders:
    usage: /<command> reload
    description: VFBuilders admin commands
    permission: vfbuilders.reload

permissions:
  vfbuilders.reload:
    description: Reload VFBuilders config, stations, categories, and blueprints
    default: op